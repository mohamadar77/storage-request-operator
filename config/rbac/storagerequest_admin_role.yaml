# This rule is not used by the project storage-request-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over storage.example.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: storage-request-operator
    app.kubernetes.io/managed-by: kustomize
  name: storagerequest-admin-role
rules:
- apiGroups:
  - storage.example.io
  resources:
  - storagerequests
  verbs:
  - '*'
- apiGroups:
  - storage.example.io
  resources:
  - storagerequests/status
  verbs:
  - get
