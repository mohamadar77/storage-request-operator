---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: storagerequests.storage.base-domain.io
spec:
  group: storage.base-domain.io
  names:
    kind: StorageRequest
    listKind: StorageRequestList
    plural: storagerequests
    singular: storagerequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.storage.size
      name: Requested
      type: string
    - jsonPath: .status.pvcPhase
      name: Phase
      type: string
    - jsonPath: .status.capacity
      name: Capacity
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          StorageRequest is the Schema for the storagerequests API. Each StorageRequest
          manages exactly one PersistentVolumeClaim with the same name in the same
          namespace. The PVC carries no owner reference; a finalizer implements the
          explicit Retain or Delete policy.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: StorageRequestSpec defines the desired state of StorageRequest.
            properties:
              lifecycle:
                default: {}
                description: lifecycle configures request lifecycle behavior such
                  as deletion policy.
                properties:
                  onDelete:
                    default: Retain
                    description: |-
                      onDelete controls PVC retention when the StorageRequest is deleted. It may
                      be changed while the request is active; the value present at deletion time
                      is authoritative. Switching to Delete is destructive and should be gated
                      by namespace RBAC and GitOps review.
                    enum:
                    - Retain
                    - Delete
                    type: string
                type: object
              storage:
                description: storage is the requested storage configuration.
                properties:
                  accessModes:
                    default:
                    - ReadWriteOnce
                    description: |-
                      accessModes are the requested PVC access modes. They are immutable after
                      PVC creation. The installed CSI driver and backend must support the mode;
                      acceptance here does not guarantee the cluster can satisfy it.
                    items:
                      enum:
                      - ReadWriteOnce
                      - ReadOnlyMany
                      - ReadWriteMany
                      - ReadWriteOncePod
                      type: string
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      size is the requested storage capacity as a positive Kubernetes quantity
                      (for example, 20Gi). The size may be increased. A decrease is rejected
                      except for the narrow terminal failed-resize recovery rule described in
                      the design, which never shrinks the actual volume.

                      Validation note: the length and exponent guards must stay first in the CEL
                      rule. Quantity parsing and comparison are superlinear in the decimal
                      exponent, so an unguarded rule lets a short string such as 1e2147483647
                      exhaust API server CPU and memory. Integer values are accepted like core
                      PVC quantities.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                    x-kubernetes-validations:
                    - message: size must be a positive Kubernetes quantity
                      rule: 'type(self) == int ? self > 0 : (self.size() <= 64 &&
                        !self.matches(''[eE][+-]?[0-9]{3,}'') && isQuantity(self)
                        && quantity(self).compareTo(quantity(''0'')) > 0)'
                  storageClassName:
                    description: |-
                      storageClassName optionally selects the StorageClass. When omitted, the
                      PVC field is left unset and Kubernetes applies its defaulting behavior
                      (including retroactive default assignment). When supplied it must be
                      non-empty and must match the created PVC's class; no migration is
                      performed. Requesting an explicitly classless PVC ("") is not supported.
                    minLength: 1
                    type: string
                  volumeMode:
                    default: Filesystem
                    description: volumeMode selects Filesystem or Block. It is immutable
                      after PVC creation.
                    enum:
                    - Filesystem
                    - Block
                    type: string
                required:
                - size
                type: object
            required:
            - storage
            type: object
          status:
            description: |-
              StorageRequestStatus defines the observed state of StorageRequest.

              The managed PVC remains authoritative for actual phase and capacity; this
              status is a user-friendly summary, never a second source of truth.
            properties:
              capacity:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  capacity is the actual capacity reported by the PVC status, not the
                  requested target. It is set only when observed.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              conditions:
                description: conditions represent the latest available observations
                  of the request state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              finalizationPolicy:
                description: |-
                  finalizationPolicy is the onDelete value captured when finalization began.
                  It is recorded on the first finalization reconcile and is immutable
                  afterwards (enforced by the CRD), so a change to spec.lifecycle.onDelete
                  during the terminating window cannot redirect finalization. This is how
                  the deletion-time policy is frozen (design section 7.4): CRD CEL cannot
                  read metadata.deletionTimestamp, so the freeze is carried by this field.
                enum:
                - Retain
                - Delete
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation last processed
                  by the controller.
                format: int64
                type: integer
              pvcName:
                description: pvcName is the managed PVC name (equal to the StorageRequest
                  name).
                type: string
              pvcPhase:
                description: |-
                  pvcPhase is the observed PVC phase (Pending, Bound, or Lost) when a PVC
                  exists. It is omitted when no PVC exists; absence is expressed by a
                  condition, not a fabricated phase.
                type: string
              pvcUID:
                description: |-
                  pvcUID is the UID of the exact PVC incarnation verified as belonging to
                  this request. Once set it is retained for the request lifetime and is used
                  to detect same-name replacement; it is never used to adopt a PVC by name.
                  The CRD enforces this: once set, the value cannot be changed or cleared.
                type: string
              volumeName:
                description: volumeName is the bound PersistentVolume name, when assigned.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: status.pvcUID is immutable once set
          rule: '!has(oldSelf.status) || !has(oldSelf.status.pvcUID) || (has(self.status)
            && has(self.status.pvcUID) && self.status.pvcUID == oldSelf.status.pvcUID)'
        - message: status.finalizationPolicy is immutable once set
          rule: '!has(oldSelf.status) || !has(oldSelf.status.finalizationPolicy) ||
            (has(self.status) && has(self.status.finalizationPolicy) && self.status.finalizationPolicy
            == oldSelf.status.finalizationPolicy)'
    served: true
    storage: true
    subresources:
      status: {}
