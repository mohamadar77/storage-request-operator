name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # Regenerate everything and fail if the committed copies are stale. This
      # must run before the tests, which regenerate as a side effect.
      - name: Verify generated files and go.mod are up to date
        run: |
          make manifests generate
          go mod tidy
          git diff --exit-code

      - name: Running Tests
        run: make test
