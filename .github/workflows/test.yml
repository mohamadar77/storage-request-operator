name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Regenerate everything and fail if the committed copies are stale. This
      # must run before the tests, which regenerate as a side effect.
      - name: Verify generated files and go.mod are up to date
        run: |
          make manifests generate
          go mod tidy
          git diff --exit-code

      - name: Running Tests
        run: make test
